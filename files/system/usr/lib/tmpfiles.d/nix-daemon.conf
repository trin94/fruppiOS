# Fedora's socket requires this directory to be writable before it starts.
d /var/nix/var/nix/daemon-socket 0755 root root -
# A persisted /var keeps the label from before the fcontext rule, relabel to var_run_t on every boot.
Z /var/nix/var/nix/daemon-socket - - - -
d /var/nix/var/nix/builds 0755 root root 7d
