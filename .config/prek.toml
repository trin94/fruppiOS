# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

exclude = '^(\.agents/|LICENSE$|cosign\.pub$|\.gitignore$)'

[[repos]]
repo = "builtin"
hooks = [
    { id = "end-of-file-fixer" },
    { id = "trailing-whitespace" },
]

[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "v0.11.0.1-1"
hooks = [
    {
        id = "shellcheck",
        name = "lint sh",
    },
]

[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "v1.7.12"
hooks = [
    {
        id = "actionlint",
        name = "lint workflows",
        # shellcheck is on the CI runner but not always local, so turn it off for the same result everywhere
        args = ["-shellcheck="],
    },
]
