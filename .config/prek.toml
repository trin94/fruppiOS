# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

exclude = '^(\.agents/|LICENSE$|cosign\.pub$|\.gitignore$)'

[[repos]]
repo = "builtin"
hooks = [
    { id = "end-of-file-fixer" },
    { id = "trailing-whitespace" },
]

[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "v0.11.0.1-1"
hooks = [
    {
        id = "shellcheck",
        name = "lint sh",
    },
]

[[repos]]
repo = "https://github.com/scop/pre-commit-shfmt"
rev = "v3.14.1-1"
hooks = [
    {
        id = "shfmt",
        name = "format sh",
        args = ["--write", "--indent=4"],
    },
]

[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "v1.7.12"
hooks = [
    {
        id = "actionlint",
        name = "lint workflows",
        # shellcheck is on the CI runner but not always local, so turn it off for the same result everywhere
        args = ["-shellcheck="],
    },
]

[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "v1.6.1"
hooks = [
    {
        id = "tombi-format",
        name = "format toml",
        args = [
            "--offline",
        ]
    },
]

[[repos]]
repo = "https://github.com/google/yamlfmt"
rev = "v0.21.0"
hooks = [
    {
        id = "yamlfmt",
        name = "format yml",
        args = ["-conf", ".config/yamlfmt.yaml"],
    },
]

[[repos]]
repo = "https://github.com/rvben/rumdl-pre-commit"
rev = "v0.2.78"
hooks = [
    {
        id = "rumdl",
        name = "format md",
        exclude = '^\.github/ISSUE_TEMPLATE/',
        args = ["--fix", "--config", ".config/rumdl.toml"],
    },
]

[[repos]]
repo = "local"
hooks = [
    {
        id = "just-fmt",
        name = "format justfile",
        entry = "just --fmt --justfile",
        language = "system",
        files = "^Justfile$",
    },
]
