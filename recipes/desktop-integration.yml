---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: dnf
    install:
      packages:
        - nautilus
        - xdg-desktop-portal-gnome
        - xdg-desktop-portal-gtk
        - gnome-keyring
        - gnome-keyring-pam
        - gvfs
        - udisks2
        - brightnessctl
  - type: files
    files:
      - source: desktop-integration
        destination: /
