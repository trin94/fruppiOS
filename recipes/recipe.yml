---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# lowercase: doubles as a Containerfile stage name, docker buildx rejects mixed case
name: fruppios
description: Minimal Fedora Atomic desktop for one person who also administers the machine.

base-image: quay.io/fedora-ostree-desktops/base-atomic
image-version: 44

modules:
  - from-file: base-cleanup.yml
  - from-file: flatpak.yml
  - from-file: nix.yml
  - from-file: updates.yml
  - from-file: login.yml
  - from-file: desktop.yml
  - from-file: desktop-integration.yml
  - type: signing
