---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/trin94/fruppios
name: fruppiOS
description: Minimal Fedora Atomic desktop for one person who also administers the machine.

# Fedora's own desktop-less atomic base, major version pinned.
base-image: quay.io/fedora-ostree-desktops/base-atomic
image-version: 44

# module configuration, executed in order; one file per concern
modules:
  - from-file: base-cleanup.yml
  - from-file: flatpak.yml
  - type: signing
