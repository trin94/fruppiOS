---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# lowercase: doubles as a Containerfile stage name, docker buildx rejects mixed case
name: fruppios
description: Minimal Fedora Atomic desktop for one person who also administers the machine.

base-image: quay.io/fedora-ostree-desktops/base-atomic
image-version: 44

modules:
  - type: dnf
    repos:
      cleanup: true
      files:
        - terra.repo # dnf module reads files/dnf/
    remove:
      packages:
        - firefox
        - firefox-langpacks
        # both seed a Flatpak remote, see ADR-0002
        - fedora-third-party
        - fedora-flathub-remote
    install:
      packages:
        - nix
        - nix-daemon
        - greetd
        - noctalia-greeter
        - niri
        - xwayland-satellite
        - noctalia
        - ptyxis
        - nautilus
        - xdg-desktop-portal-gnome
        - xdg-desktop-portal-gtk
        - gnome-keyring
        - gnome-keyring-pam
        - gvfs
        - gvfs-mtp
        - gvfs-gphoto2
        - gvfs-smb
        - gvfs-archive # subpackage merged into gvfs in F45, drop at the bump
        - gvfs-fuse
        - udisks2
        - brightnessctl
        - kitty
        - tuned-ppd
        - ddcutil
        - xdg-user-dirs
        - steam-devices
        - udev-joystick-blacklist-rm
      # weak deps of niri that the desktop defaults replace
      exclude:
        - alacritty
        - fuzzel
        - swaylock
        - waybar
  - type: files
    files:
      - source: system
        destination: /
  - type: systemd
    system:
      enabled:
        - nix.mount
        - nix-daemon.socket
        - rpm-ostreed-automatic.timer
        - greetd.service
      masked:
        # disabled is not enough, a first-boot preset-all re-enables it, see ADR-0002
        - flatpak-add-fedora-repos.service
        - bootc-fetch-apply-updates.timer
    user:
      enabled:
        - noctalia.service # unit file comes from files/systemd/user/
  - type: signing
