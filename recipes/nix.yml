---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: dnf
    install:
      packages:
        - nix
        - nix-daemon
  - type: files
    files:
      - source: nix
        destination: /
  - type: systemd
    system:
      enabled:
        - nix.mount
        - nix-daemon.socket
