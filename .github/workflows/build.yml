name: bluebuild
on:
  schedule:
    - cron:
        "00 06 * * *" # build at 06:00 UTC every day
        # (20 minutes after last ublue images start building)
  push:
    paths-ignore: # don't rebuild if only documentation has changed
      - "**.md"

  pull_request:
  workflow_dispatch: # allow manually triggering builds
concurrency:
  # only run one build at a time, but never cancel one that may be publishing
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  bluebuild:
    name: Build, test and publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
    env:
      IMAGE: ghcr.io/trin94/fruppios
      # pull requests and other branches build and test, only the default branch publishes
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    steps:
      # BlueBuild leaves every tag in the runner's rootless podman storage
      - name: Build image
        uses: blue-build/github-action@v1.13
        with:
          recipe: recipe.yml
          cli_version: v0.9.37
          push: false
          build_opts: --build-driver podman --run-driver podman
          pr_event_number: ${{ github.event.number }}

          # enabled by default, disable if your image is small and you want faster builds
          maximize_build_space: true

      - name: Install just
        run: sudo apt-get update && sudo apt-get install -y just

      - name: Test image
        run: |
          tested=$(podman images --format '{{.Repository}}:{{.Tag}}' --filter "reference=${IMAGE}:*_linux_amd64")
          echo "TESTED_IMAGE=${tested}" >>"$GITHUB_ENV"
          just test "$tested"

      - name: Log in to ghcr
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "REGISTRY_AUTH_FILE=${RUNNER_TEMP}/auth.json" >>"$GITHUB_ENV"
          echo "$GH_TOKEN" | podman login --authfile "${RUNNER_TEMP}/auth.json" ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          echo "$GH_TOKEN" | cosign login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # the commit tag goes first, nobody tracks it, so no tracked tag points at an unsigned image
      - name: Push commit tag
        if: env.PUBLISH == 'true'
        run: |
          sha_tag="${IMAGE}:${GITHUB_SHA::7}-"
          sha_tag=$(podman images --format '{{.Repository}}:{{.Tag}}' --filter "reference=${sha_tag}*")
          podman manifest push --all --compression-format=gzip \
            --digestfile "${RUNNER_TEMP}/digest" "$sha_tag" "docker://${sha_tag}"
          echo "SHA_TAG=${sha_tag}" >>"$GITHUB_ENV"
          echo "DIGEST=$(<"${RUNNER_TEMP}/digest")" >>"$GITHUB_ENV"

      # legacy signature format, containers/image only reads .sig tags
      - name: Sign
        if: env.PUBLISH == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
          COSIGN_YES: "true"
        run: |
          cosign sign --key=env://COSIGN_PRIVATE_KEY \
            --new-bundle-format=false --use-signing-config=false \
            --recursive "${IMAGE}@${DIGEST}"
          cosign verify --key=cosign.pub "${IMAGE}@${DIGEST}"

      - name: Push other tags
        if: env.PUBLISH == 'true'
        run: |
          podman images --format '{{.Repository}}:{{.Tag}}' --filter "reference=${IMAGE}" |
            while read -r tag; do
              [[ $tag == "$SHA_TAG" ]] && continue
              podman manifest exists "$tag" 2>/dev/null || continue
              skopeo copy --all --preserve-digests "docker://${IMAGE}@${DIGEST}" "docker://${tag}"
            done

      # the image is already out, a failure here can only turn the run red
      - name: Pull with the image's signature policy
        if: env.PUBLISH == 'true'
        run: |
          policy="${RUNNER_TEMP}/policy"
          mkdir -p "$policy"
          container=$(podman create "$TESTED_IMAGE")
          podman cp "${container}:/etc/containers/policy.json" "${policy}/policy.json"
          podman cp "${container}:/etc/containers/registries.d" "${policy}/registries.d"
          podman cp "${container}:/etc/pki/containers/fruppios.pub" "${policy}/fruppios.pub"
          podman rm "$container"
          jq -e --arg repo "$IMAGE" '.transports.docker[$repo][0].type == "sigstoreSigned"' "${policy}/policy.json"
          sudo install -Dm644 "${policy}/fruppios.pub" /etc/pki/containers/fruppios.pub
          skopeo --policy "${policy}/policy.json" --registries.d "${policy}/registries.d" \
            copy "docker://${IMAGE}@${DIGEST}" containers-storage:localhost/fruppios-sigcheck:latest
